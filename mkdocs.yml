site_name: "0x3xp10i73r"
site_description: "Personal offensive security notes, cheatsheets, checklists and writeups — web application testing, Active Directory, red team operations and cloud."
site_author: "0x3xp10i73r"
site_url: "https://0x3xp10i73r.github.io/notes/"
repo_name: "0x3xp10i73r/notes"
repo_url: "https://github.com/0x3xp10i73r/notes"
edit_uri: "edit/main/docs/"
copyright: "&copy; 2026 0x3xp10i73r &middot; Notes for authorized testing and educational use only."

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  # AMOLED base, Dracula palette, dark only - there is no light mode.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      separator: '[\s\-\._:/]+'
  - tags
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      archive: true
      categories: true
      categories_toc: true
      post_readtime: true
      post_readtime_words_per_minute: 220
      draft: false
  - rss:
      use_git: false
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: "date"
        datetime_format: "%Y-%m-%d"
      categories:
        - categories
        - tags
      pretty_print: false

exclude_docs: |
  SUMMARY.md
  blog/.authors.yml

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/0x3xp10i73r
      name: GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/0x3xp10i73r
      name: X
    - icon: fontawesome/solid/envelope
      link: mailto:meghantashi.h4cks@gmail.com
      name: Email

nav:
  - Home: index.md
  - How to use this vault: field-guide.md
  - Recon:
      - recon/index.md
      - Passive discovery:
          - Subdomains and virtual hosts: recon/subdomain-enumeration.md
          - OSINT and dorking: recon/osint-dorking.md
      - Active enumeration:
          - Ports and services: recon/port-service-enumeration.md
          - Web recon and fuzzing: recon/web-recon-fuzzing.md
  - Web and Bug Bounty:
      - web-bugbounty/index.md
      - Identity and access:
          - Authentication and account takeover: web-bugbounty/auth-ato-oauth-jwt.md
          - Access control, IDOR and race conditions: web-bugbounty/access-control-idor-race.md
      - Input handling:
          - Injections: web-bugbounty/injection-attacks.md
          - XSS, DOM and CSP: web-bugbounty/xss-csp-client-side.md
      - Protocol and API:
          - SSRF, CORS, CSRF and smuggling: web-bugbounty/ssrf-cors-csrf-smuggling.md
          - APIs, GraphQL and file uploads: web-bugbounty/api-graphql-modern-web.md
  - Active Directory:
      - active-directory/index.md
      - Enumeration:
          - Enumeration and BloodHound: active-directory/ad-enumeration-bloodhound.md
      - Credential attacks:
          - Kerberos and credentials: active-directory/kerberos-credential-attacks.md
          - ADCS and ACL abuse: active-directory/adcs-delegation-acl.md
      - Post-exploitation:
          - Lateral movement and pivoting: active-directory/lateral-movement-pivoting.md
          - Domain dominance and persistence: active-directory/domain-dominance-persistence.md
  - Red Team:
      - red-team/index.md
      - Initial access and payloads: red-team/initial-access-phishing.md
      - C2 infrastructure and OPSEC: red-team/c2-infrastructure-opsec.md
      - EDR and AMSI evasion: red-team/edr-amsi-evasion.md
  - Privilege Escalation:
      - privesc/index.md
      - Linux: privesc/linux-privesc.md
      - Windows: privesc/windows-privesc.md
  - Android:
      - android/index.md
      - Setup and ADB: android/setup-adb.md
      - Intercepting traffic: android/proxy-certificates.md
      - Static analysis: android/static-analysis.md
      - Dynamic analysis: android/dynamic-analysis.md
      - Testing checklist: android/checklist.md
      - Frida: android/frida.md
      - Glossary: android/glossary.md
      - Tools and references: android/tools.md
      - iOS and cross-platform: android/ios-cross-platform.md
  - Cloud:
      - cloud-mobile/index.md
      - AWS, Azure and GCP: cloud-mobile/aws-azure-gcp.md
  - Checklists:
      - checklists-arsenal/index.md
      - Working checklists:
          - Web and bug bounty checklist: checklists-arsenal/web-bugbounty-checklist.md
          - Internal and AD checklist: checklists-arsenal/internal-ad-checklist.md
      - Tooling and reference:
          - Burp Suite and tooling: checklists-arsenal/burp-extensions-arsenal.md
          - Reference index: checklists-arsenal/security-reference-index.md
  - Blog: blog/index.md
  - Tags: tags.md
  - About: about.md
