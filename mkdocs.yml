site_name: "0x3xp10i73r"
site_description: "Personal offensive security notes, cheatsheets, checklists and writeups — web application testing, Active Directory, privilege escalation, TryHackMe and Hack The Box."
site_author: "0x3xp10i73r"
site_url: "https://0x3xp10i73r.github.io/offsec-vault/"

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  # Dracula charcoal base, dark only - there is no light mode.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      separator: '[\s\-\._:/]+'
  - tags
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      archive: true
      categories: true
      categories_toc: true
      post_readtime: true
      post_readtime_words_per_minute: 220
      draft: false
  - rss:
      use_git: false
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: "date"
        datetime_format: "%Y-%m-%d"
      categories:
        - categories
        - tags
      pretty_print: false

exclude_docs: |
  SUMMARY.md
  blog/.authors.yml

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra-charcoal.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/0x3xp10i73r
      name: X
    - icon: fontawesome/solid/envelope
      link: mailto:meghantashi.h4cks@gmail.com
      name: Email

